<!DOCTYPE html>
<html lang="mn">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALANCE НББ</title>
<style>
:root{
  --blue:#1F6FEB; --blue-d:#1758C2; --blue-l:#E8F0FD; --navy:#0F1E3D; --navy-2:#18294F;
  --bg:#F3F5F9; --card:#FFFFFF; --line:#E2E6EE; --line-2:#EEF1F6; --text:#1B2333; --muted:#6B7488;
  --ok:#14804A; --ok-l:#E3F5EB; --warn:#B45309; --warn-l:#FEF3E2; --bad:#C2342B; --bad-l:#FCE9E7;
  --radius:8px; --shadow:0 1px 2px rgba(15,30,61,.06),0 1px 8px rgba(15,30,61,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
[hidden]{display:none!important}
.num,td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12px} .bold{font-weight:600}
.logo{display:inline-block;width:30px;height:30px;flex:none}

/* Login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1A3570)}
.login-box{background:#fff;border-radius:12px;padding:32px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.login-box h1{font-size:20px;margin:12px 0 4px} .login-box p{margin:0 0 20px}
.login-box label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
.login-box input{width:100%}
.login-box .btn{width:100%;margin-top:20px;justify-content:center;padding:10px}

/* Layout */
.app{display:flex;min-height:100%}
.side{width:224px;flex:none;background:var(--navy);color:#C9D3E8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 18px;color:#fff;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-weight:400;color:#8FA0C4;font-size:11px;letter-spacing:0}
.nav{flex:1;overflow:auto;padding:4px 8px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#C9D3E8;margin:1px 0;cursor:pointer}
.nav a:hover{background:var(--navy-2);color:#fff}
.nav a.on{background:var(--blue);color:#fff}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#6F7FA3;padding:14px 10px 4px}
.side-foot{padding:12px 16px;font-size:11px;color:#6F7FA3}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:5}
.top h2{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top select{max-width:260px}
.chip{display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;background:#fff;position:relative}
.chip .av{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.menu{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:200px;padding:6px;z-index:20}
.menu a{display:block;padding:8px 10px;border-radius:6px;color:var(--text);cursor:pointer}
.menu a:hover{background:var(--bg)}
.view{padding:20px;max-width:1400px;width:100%}

/* Controls */
input,select,textarea{border:1px solid #CDD3DE;border-radius:6px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
input.bad{border-color:var(--bad);background:var(--bad-l)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #CDD3DE;background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.danger{color:var(--bad);border-color:#EBC0BC}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.bar .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:15px;flex:1}
.card-b{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.form input,.form select,.form textarea{width:100%}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-warn{background:var(--warn-l);color:var(--warn)} .b-bad{background:var(--bad-l);color:var(--bad)} .b-mute{background:var(--line-2);color:var(--muted)} .b-blue{background:var(--blue-l);color:var(--blue-d)}
.alert{padding:10px 14px;border-radius:6px;margin-bottom:12px}
.alert.warn{background:var(--warn-l);color:var(--warn)} .alert.bad{background:var(--bad-l);color:var(--bad)} .alert.ok{background:var(--ok-l);color:var(--ok)} .alert.info{background:var(--blue-l);color:var(--blue-d)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tabs a.on{border-color:var(--blue);color:var(--text);font-weight:600}

/* Tables */
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{background:#F7F8FB;color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t th.n{text-align:right} table.t td:first-child{white-space:nowrap}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#F7FAFF}
table.t tr.grp td{font-weight:600;background:#FAFBFD}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#F7F8FB}
table.t tr.sub td{font-weight:600}
table.t tr.hd td{font-weight:700;background:var(--blue-l);color:var(--navy)}
table.t td.ind1{padding-left:26px} table.t td.ind2{padding-left:42px} table.t td.ind3{padding-left:58px} table.t td.ind4{padding-left:74px}
.neg{color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}

/* Entry editor */
table.lines td{padding:4px 6px;border-bottom:1px solid var(--line-2)}
table.lines input,table.lines select{width:100%;padding:6px 7px}
table.lines td.acc{min-width:230px} table.lines td.amt{width:150px}
table.lines .an{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.totals{display:flex;gap:24px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.totals div{text-align:right} .totals .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tpl{display:flex;gap:8px;flex-wrap:wrap}

/* Reports */
.rep-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
.rep-list a{display:block;padding:8px 12px;border-radius:6px;color:var(--text);cursor:pointer}
.rep-list a:hover{background:var(--line-2)} .rep-list a.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.rep-head{text-align:center;margin:6px 0 14px} .rep-head h3{margin:0;font-size:17px} .rep-head div{color:var(--muted);font-size:13px}

/* Periods */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.month{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.month h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}

/* Modal, toast, busy */
.modal{position:fixed;inset:0;background:rgba(15,30,61,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal-box{background:#fff;border-radius:10px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box.wide{max-width:1000px}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)} .modal-h h3{margin:0;flex:1;font-size:16px}
.modal-b{padding:18px} .modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);max-width:420px}
.toast.err{background:var(--bad)} .toast.ok{background:var(--ok)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--blue),transparent);background-size:50% 100%;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:-50% 0}to{background-position:150% 0}}

@media (max-width:900px){
  .app{flex-direction:column} .side{width:auto;height:auto;position:static}
  .nav{display:flex;overflow-x:auto;padding:0 8px 8px} .nav .sep,.side-foot{display:none} .nav a{white-space:nowrap}
  .rep-layout{grid-template-columns:1fr} .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{position:static;flex-wrap:wrap;height:auto;padding:10px 14px} .view{padding:12px}
}
@media (max-width:640px){ .g2,.g3,.g4,.edhead{grid-template-columns:1fr!important} }
@media print{
  .side,.top,.no-print,.rep-list,#toast,#busy{display:none!important}
  body{background:#fff} .view{padding:0;max-width:none} .card{border:none;box-shadow:none}
  .rep-layout{display:block} table.t th{position:static}
  body.mopen .app{display:none!important} body.mopen .modal{position:static;background:none;padding:0;display:block} body.mopen .modal-box{box-shadow:none;max-width:none} body.mopen .modal-f,body.mopen .modal-h button{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="logo" viewBox="0 0 32 32">
    <defs><clipPath id="lc"><rect width="32" height="32" rx="8"/></clipPath></defs>
    <g clip-path="url(#lc)"><rect width="32" height="32" fill="#1F6FEB"/><path d="M32 0V32H0Z" fill="#0F1E3D"/></g>
    <circle cx="16" cy="16" r="4.2" fill="#fff"/>
  </symbol>
</svg>

<div id="login" class="login" hidden>
  <form class="login-box" onsubmit="doLogin(event)">
    <svg class="logo" style="width:40px;height:40px"><use href="#logo"/></svg>
    <h1>BALANCE НББ</h1>
    <p class="muted">Нягтлан бодох бүртгэлийн систем</p>
    <label>Нэвтрэх нэр</label><input id="lu" autocomplete="username" required>
    <label>Нууц үг</label><input id="lp" type="password" autocomplete="current-password" required>
    <div id="lerr" class="alert bad" style="margin-top:14px" hidden></div>
    <button class="btn pri" id="lbtn">Нэвтрэх</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><svg class="logo"><use href="#logo"/></svg><div>BALANCE НББ<small>Нягтлан бодох бүртгэл</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="ver"></div>
  </aside>
  <div class="main">
    <header class="top">
      <h2 id="ptitle"></h2>
      <select id="csel" onchange="switchCompany(this.value)" title="Компани"></select>
      <div class="chip" onclick="toggleUserMenu(event)"><span class="av" id="uav"></span><span id="uname"></span>
        <div class="menu" id="umenu" hidden>
          <div class="small muted" style="padding:6px 10px" id="urole"></div>
          <a onclick="changePasswordModal(false)">Нууц үг солих</a>
          <a onclick="doLogout()">Гарах</a>
        </div>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="modal" class="modal" hidden onmousedown="if(event.target===this&&!S.modalLocked)closeModal()"><div class="modal-box" id="mbox"></div></div>
<div id="toast"></div>
<div id="busy" hidden></div>

<script>
/* ================= Core ================= */
const S = { token: null, sess: null, cid: null, M: null, page: 'dashboard', ed: null, rep: 'tb', lastTable: null, modalLocked: false, imp: null };
const $ = s => document.querySelector(s);
const PAGES = {
  dashboard: ['Хяналтын самбар', pgDashboard],
  entries: ['Журнал', pgEntries],
  editor: ['Гүйлгээ бичих', pgEditor],
  reports: ['Тайлан', pgReports],
  accounts: ['Дансны төлөвлөгөө', pgAccounts],
  partners: ['Харилцагч', pgPartners],
  periods: ['Тайлант үе ба хаалт', pgPeriods],
  import: ['Импорт', pgImport],
  settings: ['Тохиргоо', pgSettings]
};

function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function pref(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/** "1,234.5" → 123450 (мөнгө). Буруу бол NaN. */
function toMinor(v) {
  if (v === '' || v === null || v === undefined) return 0;
  let s = String(v).replace(/[\s,'₮]/g, '');
  if (s === '' || s === '-') return 0;
  if (!/^-?\d*(\.\d*)?$/.test(s) || s === '.') return NaN;
  const neg = s[0] === '-'; if (neg) s = s.slice(1);
  const [ip, fp = ''] = s.split('.');
  let n = Number((ip || '0') + (fp + '00').slice(0, 2));
  if (fp.length > 2 && Number(fp[2]) >= 5) n += 1;
  return neg ? -n : n;
}
function fmt(m) {
  m = Number(m) || 0; const neg = m < 0; m = Math.abs(m);
  const i = Math.floor(m / 100), f = m % 100;
  return (neg ? '-' : '') + String(i).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(f).padStart(2, '0');
}
function fmtZ(m) { return m ? fmt(m) : ''; }
function money(m) { return `<span class="${m < 0 ? 'neg' : ''}">${fmt(m)}</span>`; }
function today() { return S.sess ? S.sess.app.today : new Date().toISOString().slice(0, 10); }
function yearStart() { return today().slice(0, 4) + '-01-01'; }
function monthStart() { return today().slice(0, 8) + '01'; }
function can(p) { return !!(S.sess && S.sess.perms[p]); }

function rpc(fn, ...args) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error((e && e.message) || String(e))))[fn](...args);
  });
}
let busyN = 0;
function busy(on) { busyN += on ? 1 : -1; $('#busy').hidden = busyN <= 0; }
async function call(method, params) {
  busy(true);
  try {
    const r = await rpc('api', S.token, method, Object.assign({ cid: S.cid }, params || {}));
    if (!r || !r.ok) {
      const msg = (r && r.error) || 'Тодорхойгүй алдаа';
      if (/Нэвтрэх хугацаа/.test(msg)) { logoutLocal(msg); }
      throw new Error(msg);
    }
    return r.data;
  } finally { busy(false); }
}
function toast(msg, type) {
  const d = document.createElement('div');
  d.className = 'toast ' + (type || ''); d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 7000 : 3500);
}
function err(e) { toast(e.message || String(e), 'err'); }

function modal(title, body, foot, opts) {
  opts = opts || {};
  S.modalLocked = !!opts.locked;
  $('#mbox').className = 'modal-box' + (opts.wide ? ' wide' : '');
  $('#mbox').innerHTML = `<div class="modal-h"><h3>${esc(title)}</h3>${opts.locked ? '' : '<button class="btn ghost sm" onclick="closeModal()">✕</button>'}</div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}`;
  $('#modal').hidden = false; document.body.classList.add('mopen');
  const f = $('#mbox').querySelector('input:not([type=checkbox]):not([readonly]),select,textarea');
  if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#modal').hidden = true; S.modalLocked = false; document.body.classList.remove('mopen'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden && !S.modalLocked) closeModal(); });

function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => {
    window.__cb = v => { closeModal(); res(v); };
    modal(title, `<p style="margin:0">${text}</p>`,
      `<button class="btn" onclick="__cb(false)">Болих</button><button class="btn ${danger ? 'danger' : 'pri'}" onclick="__cb(true)">${esc(okLabel || 'Тийм')}</button>`);
  });
}

/* ================= Auth ================= */
async function doLogin(ev) {
  ev.preventDefault();
  $('#lerr').hidden = true; $('#lbtn').disabled = true;
  try {
    const r = await rpc('login', $('#lu').value, $('#lp').value);
    if (!r.ok) throw new Error(r.error);
    S.token = r.data.token; store('nbb_tok', S.token);
    $('#lp').value = '';
    await startSession(r.data.session);
  } catch (e) { $('#lerr').textContent = e.message; $('#lerr').hidden = false; }
  finally { $('#lbtn').disabled = false; }
}
function logoutLocal(msg) {
  S.token = null; S.sess = null; store('nbb_tok', null);
  closeModal();
  $('#app').hidden = true; $('#login').hidden = false;
  if (msg) { $('#lerr').textContent = msg; $('#lerr').hidden = false; }
}
async function doLogout() { try { await rpc('logout', S.token); } catch (e) {} logoutLocal(); }
function toggleUserMenu(e) { e.stopPropagation(); $('#umenu').hidden = !$('#umenu').hidden; }
document.addEventListener('click', () => { const m = $('#umenu'); if (m) m.hidden = true; });

async function startSession(sess) {
  S.sess = sess;
  $('#login').hidden = true; $('#app').hidden = false;
  $('#uname').textContent = sess.user.name; $('#uav').textContent = (sess.user.name || '?').slice(0, 1).toUpperCase();
  $('#urole').textContent = sess.user.username + ' · ' + sess.user.roleName;
  $('#ver').textContent = sess.app.name + ' v' + sess.app.version;
  if (sess.user.must_change) { changePasswordModal(true); return; }
  if (!sess.companies.length) { $('#view').innerHTML = '<div class="alert warn">Танд хандах эрхтэй компани алга. Админд хандана уу.</div>'; return; }
  const last = pref('nbb_cid');
  S.cid = sess.companies.some(c => c.id === last) ? last : sess.companies[0].id;
  $('#csel').innerHTML = sess.companies.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  $('#csel').value = S.cid;
  await loadMaster();
  renderNav();
  go(location.hash ? location.hash.slice(1) : 'dashboard');
}
async function switchCompany(id) {
  S.cid = id; pref('nbb_cid', id);
  await loadMaster();
  go(S.page === 'editor' ? 'entries' : S.page);
}
async function loadMaster() {
  S.M = await call('master');
  S.accBy = {}; S.M.accounts.forEach(a => S.accBy[a.code] = a);
  S.partBy = {}; S.M.partners.forEach(p => S.partBy[p.id] = p);
  S.segBy = {}; S.M.segments.forEach(s => S.segBy[s.code] = s);
}

function changePasswordModal(forced) {
  modal(forced ? 'Нууц үгээ солино уу' : 'Нууц үг солих',
    `${forced ? '<div class="alert info">Анх нэвтэрч байгаа тул нууц үгээ солих шаардлагатай.</div>' : ''}
     <div class="grid form"><label>Одоогийн нууц үг<input type="password" id="pw0"></label>
     <label>Шинэ нууц үг (8+ тэмдэгт)<input type="password" id="pw1"></label>
     <label>Шинэ нууц үг давтах<input type="password" id="pw2"></label></div>`,
    `${forced ? '<button class="btn" onclick="doLogout()">Гарах</button>' : '<button class="btn" onclick="closeModal()">Болих</button>'}
     <button class="btn pri" onclick="savePassword(${forced})">Хадгалах</button>`, { locked: forced });
}
async function savePassword(forced) {
  if ($('#pw1').value !== $('#pw2').value) return toast('Шинэ нууц үг таарахгүй байна.', 'err');
  try {
    const sess = await call('changePassword', { old: $('#pw0').value, password: $('#pw1').value });
    closeModal(); toast('Нууц үг солигдлоо.', 'ok');
    if (forced) startSession(sess);
  } catch (e) { err(e); }
}

/* ================= Navigation ================= */
function renderNav() {
  const items = [
    ['sep', 'Үндсэн'], ['dashboard', 'Хяналтын самбар'], ['entries', 'Журнал'],
    can('draft') ? ['editor', '+ Гүйлгээ бичих'] : null,
    ['reports', 'Тайлан'],
    ['sep', 'Лавлах'], ['accounts', 'Дансны төлөвлөгөө'], ['partners', 'Харилцагч'],
    ['sep', 'Хяналт'], ['periods', 'Тайлант үе ба хаалт'], can('draft') ? ['import', 'Импорт'] : null, ['settings', 'Тохиргоо']
  ].filter(Boolean);
  $('#nav').innerHTML = items.map(([k, l]) => k === 'sep' ? `<div class="sep">${esc(l)}</div>` : `<a data-p="${k}" onclick="go('${k}')">${esc(l)}</a>`).join('');
}
function go(page, arg) {
  if (!PAGES[page]) page = 'dashboard';
  if (page === 'editor' && arg === undefined) S.ed = null;
  S.page = page;
  try { history.replaceState(null, '', '#' + page); } catch (e) {}
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  $('#ptitle').textContent = PAGES[page][0];
  $('#view').innerHTML = '<div class="empty">Ачаалж байна…</div>';
  Promise.resolve(PAGES[page][1](arg)).catch(e => { $('#view').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; });
}

/* ================= Helpers ================= */
function accLabel(code) { const a = S.accBy[code]; return a ? `${a.code} — ${a.name}` : (code || ''); }
function partLabel(id) { const p = S.partBy[id]; return p ? `${p.code} — ${p.name}` : ''; }
function parseAcc(v) { v = String(v || '').trim(); if (!v) return ''; const code = v.split(/\s+[—-]\s+|\s+/)[0]; return S.accBy[code] ? code : null; }
function parsePartner(v) {
  v = String(v || '').trim(); if (!v) return '';
  const code = v.split(/\s+[—-]\s+/)[0].trim();
  const p = S.M.partners.find(x => x.code === code) || S.M.partners.find(x => x.name.toLowerCase() === v.toLowerCase());
  return p ? p.id : null;
}
function leafAccounts() { return S.M.accounts.filter(a => !a.is_group && a.active); }
function accByType(sub) { return leafAccounts().filter(a => a.subtype === sub); }
function accOptions(list, sel, empty) {
  return (empty !== undefined ? `<option value="">${esc(empty)}</option>` : '') +
    list.map(a => `<option value="${esc(a.code)}" ${a.code === sel ? 'selected' : ''}>${esc(a.code + ' — ' + a.name)}</option>`).join('');
}
function segOptions(sel, empty) {
  return `<option value="">${esc(empty || '—')}</option>` + S.M.segments.filter(s => s.active || s.code === sel)
    .map(s => `<option value="${esc(s.code)}" ${s.code === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
}
function partnerOptions(sel, empty) {
  return `<option value="">${esc(empty || '— Бүгд —')}</option>` + S.M.partners.map(p => `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(p.code + ' — ' + p.name)}</option>`).join('');
}
function datalists() {
  return `<datalist id="dl-acc">${leafAccounts().map(a => `<option value="${esc(a.code + ' — ' + a.name)}">`).join('')}</datalist>
          <datalist id="dl-part">${S.M.partners.filter(p => p.active).map(p => `<option value="${esc(p.code + ' — ' + p.name)}">`).join('')}</datalist>`;
}
function statusBadge(e) {
  if (e.status === 'DRAFT') return '<span class="badge b-warn">Ноорог</span>';
  if (e.reversed_by) return '<span class="badge b-mute">Буцаагдсан</span>';
  if (e.source === 'REVERSAL' || e.source === 'CLOSING_REV') return '<span class="badge b-blue">Буцаалт</span>';
  if (e.source === 'CLOSING') return '<span class="badge b-blue">Жилийн хаалт</span>';
  return '<span class="badge b-ok">Батлагдсан</span>';
}
const SRC = { MANUAL: 'Гараар', IMPORT: 'Импорт', REVERSAL: 'Буцаалт', CLOSING: 'Хаалт', CLOSING_REV: 'Хаалт цуцлалт' };

async function loadEntries() {

async function openEntry(id) {
  try {
    const e = await call('entry', { id });
    let td = 0, tc = 0; e.lines.forEach(l => { td += Number(l.debit) || 0; tc += Number(l.credit) || 0; });
    const acts = [];
    if (e.status === 'DRAFT') {
      if (can('draft')) acts.push(`<button class="btn danger" onclick="deleteDraft('${esc(e.id)}')">Устгах</button>`, `<button class="btn" onclick="editDraft('${esc(e.id)}')">Засах</button>`);
      if (can('post')) acts.push(`<button class="btn pri" onclick="postDraft('${esc(e.id)}')">Батлах</button>`);
    } else if (!e.reversed_by && e.source !== 'REVERSAL' && e.source !== 'CLOSING' && e.source !== 'CLOSING_REV' && can('reverse')) {
      acts.push(`<button class="btn danger" onclick="reverseModal('${esc(e.id)}','${esc(e.number)}')">Буцаалт хийх</button>`);
    }
    if (can('draft')) acts.push(`<button class="btn" onclick="copyEntry('${esc(e.id)}')">Хуулбарлах</button>`);
    acts.push(`<button class="btn" onclick="window.print()">Хэвлэх</button>`);
    modal((e.number || 'Ноорог') + ' · ' + e.date, `
      <div class="grid g3" style="margin-bottom:12px">
        <div><div class="small muted">Гүйлгээний утга</div>${esc(e.description)}</div>
        <div><div class="small muted">Баримт / лавлах</div>${esc(e.ref) || '—'}</div>
        <div><div class="small muted">Төлөв</div>${statusBadge(e)}</div>
        <div><div class="small muted">Мөнгөн гүйлгээний ангилал</div>${esc(S.sess.consts.CF[e.cf] || 'Автомат')}</div>
        <div><div class="small muted">Бичсэн</div>${esc(e.created_by)} · ${esc(e.created_at)}</div>
        <div><div class="small muted">Баталсан</div>${esc(e.posted_by || '—')} ${esc(e.posted_at || '')}</div>
      </div>
      ${e.reversed_by_number ? `<div class="alert info">Энэ гүйлгээг ${esc(e.reversed_by_number)} гүйлгээгээр буцаасан.</div>` : ''}
      ${e.reversal_of_number ? `<div class="alert info">${esc(e.reversal_of_number)} гүйлгээний буцаалт.</div>` : ''}
      <div class="tw"><table class="t"><thead><tr><th>Данс</th><th>Харилцагч</th><th>Чиглэл</th><th>Тайлбар</th><th class="n">Дебет</th><th class="n">Кредит</th></tr></thead><tbody>
      ${e.lines.map(l => `<tr><td>${esc(accLabel(l.account))}</td><td>${esc(partLabel(l.partner_id))}</td><td>${esc(S.segBy[l.segment] ? S.segBy[l.segment].name : '')}</td><td>${esc(l.description)}</td><td class="n">${fmtZ(l.debit)}</td><td class="n">${fmtZ(l.credit)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="4">Нийт</td><td class="n">${fmt(td)}</td><td class="n">${fmt(tc)}</td></tr></tbody></table></div>`,
      acts.join(''), { wide: true });
  } catch (x) { err(x); }
}
async function deleteDraft(id) {
  if (!await confirmBox('Ноорог устгах', 'Энэ ноорог гүйлгээг устгах уу?', 'Устгах', true)) return;
  try { await call('deleteDraft', { id }); toast('Устгагдлаа.', 'ok'); if (S.page === 'entries') loadEntries(); else go('entries'); } catch (e) { err(e); }
}
async function postDraft(id) {
  try { const r = await call('postEntry', { id }); closeModal(); toast(r.number + ' батлагдлаа.', 'ok'); if (S.page === 'entries') loadEntries(); else go(S.page); } catch (e) { err(e); }
}
function reverseModal(id, number) {
  modal('Буцаалт хийх: ' + number, `
    <div class="alert info">Батлагдсан гүйлгээг устгахгүй. Дебет, кредитийг сольсон буцаалтын шинэ гүйлгээ бичигдэнэ.</div>
    <div class="grid g2 form"><label>Буцаалтын огноо<input type="date" id="rvd" value="${today()}"></label>
    <label>Шалтгаан<input id="rvr" placeholder="Жишээ: дүн буруу орсон"></label></div>`,
    `<button class="btn" onclick="closeModal()">Болих</button><button class="btn danger" onclick="doReverse('${esc(id)}')">Буцаах</button>`);
}
async function doReverse(id) {
  try { const r = await call('reverse', { id, date: $('#rvd').value, reason: $('#rvr').value }); closeModal(); toast('Буцаалт ' + r.number + ' бичигдлээ.', 'ok'); if (S.page === 'entries') loadEntries(); else go(S.page); } catch (e) { err(e); }
}
async function editDraft(id) {
  try {
    const e = await call('entry', { id }); closeModal();
    S.ed = { id: e.id, date: e.date, description: e.description, ref: e.ref, cf: e.cf, lines: e.lines.map(l => lineFromMinor(l)) };
    go('editor', 'keep');
  } catch (x) { err(x); }
}
async function copyEntry(id) {
  try {
    const e = await call('entry', { id }); closeModal();
    S.ed = { id: null, date: today(), description: e.description, ref: '', cf: e.cf, lines: e.lines.map(l => lineFromMinor(l)) };
    go('editor', 'keep');
  } catch (x) { err(x); }
}
function lineFromMinor(l) {
  return { account: l.account, partner_id: l.partner_id || '', segment: l.segment || '', description: l.description || '',
    debit: Number(l.debit) ? fmt(l.debit) : '', credit: Number(l.credit) ? fmt(l.credit) : '' };
}

function renderLines() {
  const ed = S.ed;
  $('#elines').innerHTML = ed.lines.map((l, i) => {
    const a = S.accBy[l.account];
    const needP = a && (a.subtype === 'RECEIVABLE' || a.subtype === 'PAYABLE');
    return `<tr>
      <td class="acc"><input list="dl-acc" value="${esc(l.account ? accLabel(l.account) : '')}" onchange="setAcc(${i},this)" placeholder="Код эсвэл нэр">
        <div class="an">${a ? esc(S.sess.consts.TYPES[a.type] + (a.subtype ? ' · ' + S.sess.consts.SUBTYPES[a.subtype] : '')) : ''}</div></td>
      <td><input list="dl-part" value="${esc(partLabel(l.partner_id))}" onchange="setPart(${i},this)" placeholder="${needP ? 'Заавал сонгоно' : ''}" class="${needP && !l.partner_id ? 'bad' : ''}"></td>
      <td style="width:130px"><select onchange="S.ed.lines[${i}].segment=this.value">${segOptions(l.segment)}</select></td>
      <td><input value="${esc(l.description)}" oninput="S.ed.lines[${i}].description=this.value"></td>
      <td class="amt"><input class="num" value="${esc(l.debit)}" oninput="setAmt(${i},'debit',this)" onblur="blurAmt(${i},'debit',this)" inputmode="decimal"></td>
      <td class="amt"><input class="num" value="${esc(l.credit)}" oninput="setAmt(${i},'credit',this)" onblur="blurAmt(${i},'credit',this)" inputmode="decimal"></td>
      <td style="width:36px"><button class="btn ghost sm" title="Мөр устгах" onclick="delLine(${i})">✕</button></td></tr>`;
  }).join('');
  renderTotals();
}
function setAcc(i, el) {
  const code = parseAcc(el.value);
  if (code === null) { el.classList.add('bad'); toast('Данс олдсонгүй: ' + el.value, 'err'); return; }
  S.ed.lines[i].account = code; renderLines();
}
function setPart(i, el) {
  const id = parsePartner(el.value);
  if (id === null) { el.classList.add('bad'); toast('Харилцагч олдсонгүй. "Харилцагч" цэснээс бүртгэнэ үү.', 'err'); return; }
  S.ed.lines[i].partner_id = id; renderLines();
}
function setAmt(i, k, el) {
  S.ed.lines[i][k] = el.value;
  el.classList.toggle('bad', isNaN(toMinor(el.value)) || toMinor(el.value) < 0);
  renderTotals();
}
function blurAmt(i, k, el) {
  const m = toMinor(el.value);
  if (!isNaN(m) && el.value.trim()) { el.value = m ? fmt(m) : ''; S.ed.lines[i][k] = el.value; }
  // нэг талыг бөглөхөд нөгөө талыг цэвэрлэнэ
  if (m && !isNaN(m)) { const o = k === 'debit' ? 'credit' : 'debit'; if (S.ed.lines[i][o]) { S.ed.lines[i][o] = ''; renderLines(); return; } }
  // сүүлийн мөр бөглөгдвөл шинэ мөр нэмнэ
  if (i === S.ed.lines.length - 1 && m) addLine();
}
function addLine() {
  const l = blankLine();
  const t = edTotals();
  if (t.d !== t.c) { const diff = t.d - t.c; if (diff > 0) l.credit = fmt(diff); else l.debit = fmt(-diff); }
  S.ed.lines.push(l); renderLines();
}
function delLine(i) { S.ed.lines.splice(i, 1); if (!S.ed.lines.length) S.ed.lines.push(blankLine()); renderLines(); }
function edTotals() {
  let d = 0, c = 0, bad = false;
  S.ed.lines.forEach(l => { const x = toMinor(l.debit), y = toMinor(l.credit); if (isNaN(x) || isNaN(y)) bad = true; else { d += x; c += y; } });
  return { d, c, bad };
}
function renderTotals() {
  const t = edTotals(), diff = t.d - t.c;
  $('#etot').innerHTML = `<div><div class="small muted">Дебет</div><div class="v">${fmt(t.d)}</div></div>
    <div><div class="small muted">Кредит</div><div class="v">${fmt(t.c)}</div></div>
    <div><div class="small muted">Зөрүү</div><div class="v" style="color:${diff ? 'var(--bad)' : 'var(--ok)'}">${diff ? fmt(diff) : '✓ Тэнцсэн'}</div></div>`;
}
async function saveEntry(post) {
  const ed = S.ed, t = edTotals();
  if (t.bad) return toast('Буруу дүн байна.', 'err');
  if (post && t.d !== t.c) return toast('Дебет, кредит тэнцэхгүй байна.', 'err');
  const lines = ed.lines.filter(l => l.account || l.debit || l.credit || l.description || l.partner_id);
  const payload = { id: ed.id || undefined, date: ed.date, description: ed.description, ref: ed.ref, cf: ed.cf, lines };
  try {
    if (post) {
      const r = await call('postEntry', payload);
      toast(r.number + ' батлагдлаа.', 'ok');
      S.ed = null; go('editor');
    } else {
      const r = await call('saveDraft', payload);
      ed.id = r.id; toast('Ноорог хадгалагдлаа.', 'ok'); $('#ptitle').textContent = 'Ноорог засах';
    }

}

function accTree() {
  const by = {}, ch = {}, roots = [], out = [];
  S.M.accounts.forEach(a => by[a.code] = a);
  S.M.accounts.forEach(a => { if (a.parent && by[a.parent]) (ch[a.parent] = ch[a.parent] || []).push(a); else roots.push(a); });
  const seen = {};
  const walk = (a, lv) => { if (seen[a.code]) return; seen[a.code] = 1; out.push({ a, lv }); (ch[a.code] || []).forEach(c => walk(c, lv + 1)); };
  roots.forEach(r => walk(r, 0));
  return out;
}

function balDC(m) { return m ? `${fmt(Math.abs(m))} <span class="small muted">${m > 0 ? 'Д' : 'К'}</span>` : '0.00'; }
function drill(code) {
  const f = v('rf') || yearStart(), t = v('rt') || today();
  S.rep = 'gl'; selRep('gl'); $('#ra').value = code; $('#rf').value = f; $('#rt').value = t; runRep();
}
function csvCell(c) { if (typeof c === 'number') return String(Math.round(c * 100) / 100); const s = String(c === undefined || c === null ? '' : c); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function downloadText(name, text, mime) {
  const blob = new Blob(['﻿' + text], { type: mime || 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function copyTable() {
  if (!S.lastTable) return toast('Эхлээд тайлангаа гаргана уу.', 'err');
  const tsv = S.lastTable.rows.map(r => r.map(c => typeof c === 'number' ? String(Math.round(c * 100) / 100) : String(c === undefined || c === null ? '' : c).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
  modal('Хүснэгт хуулах', `<p class="small muted" style="margin-top:0">Доорх өгөгдөл сонгогдсон байна — <b>Ctrl+C</b> (Mac: ⌘+C) дараад Excel эсвэл Google Sheets-д буулгана уу.</p>
    <textarea id="cpt" rows="14" style="width:100%;font:12px monospace" readonly>${esc(tsv)}</textarea>`, '<button class="btn" onclick="closeModal()">Хаах</button>', { wide: true });
  setTimeout(() => { const t = $('#cpt'); t.focus(); t.select(); try { document.execCommand('copy'); toast('Хуулагдлаа.', 'ok'); } catch (e) {} }, 60);
}
function exportCsv() {
  if (!S.lastTable) return toast('Эхлээд тайлангаа гаргана уу.', 'err');
  const t = S.lastTable;
  downloadText(`${S.M.company.code}_${t.name}_${today()}.csv`, t.rows.map(r => r.map(csvCell).join(',')).join('\r\n'));
}

async function pgPeriods(year) {
  year = year || S.perYear || today().slice(0, 4); S.perYear = year;
  const r = await call('periods', { year });
  const cp = can('period');
  $('#view').innerHTML = `
    <div class="bar no-print"><label>Он<input type="number" id="py" value="${esc(r.year)}" style="width:110px" onchange="go('periods',this.value)"></label>
      <div class="grow"></div>
      ${cp ? (r.yearClosed ? `<button class="btn danger" onclick="yearAction('reopenYear','${r.year}')">Жилийн хаалтыг цуцлах</button>` : `<button class="btn pri" onclick="yearAction('closeYear','${r.year}')">${r.year} оны жилийн хаалт хийх</button>`) : ''}</div>
    ${r.yearClosed ? `<div class="alert ok">${esc(r.year)} оны хаалт хийгдсэн (${esc(r.closingNumber)}). Орлого, зардлын дансууд хаагдаж цэвэр ашиг хуримтлагдсан ашигт шилжсэн.</div>`
      : '<div class="alert info">Сар бүрийг хааснаар тухайн сард гүйлгээ бичих, засах боломжгүй болно. Жилийн хаалт нь орлого, зардлын дансыг хааж цэвэр ашгийг хуримтлагдсан ашигт шилжүүлээд бүх сарыг хаана.</div>'}
    <div class="months">${r.months.map(m => `<div class="month"><h4>${esc(m.period)} ${m.status === 'CLOSED' ? '<span class="badge b-mute">Хаалттай</span>' : '<span class="badge b-ok">Нээлттэй</span>'}</h4>
      <div class="small muted">${m.posted} батлагдсан${m.drafts ? `, <span style="color:var(--warn)">${m.drafts} ноорог</span>` : ''}</div>
      ${m.closed_by ? `<div class="small muted">Хаасан: ${esc(m.closed_by)} ${esc(m.closed_at.slice(0, 10))}</div>` : ''}
      ${cp ? `<div style="margin-top:8px">${m.status === 'CLOSED' ? `<button class="btn sm" onclick="perAction('reopenPeriod','${m.period}')">Нээх</button>` : `<button class="btn sm" onclick="perAction('closePeriod','${m.period}')">Хаах</button>`}</div>` : ''}</div>`).join('')}</div>`;
}
async function perAction(m, period) {
  try { await call(m, { period }); toast(period + (m === 'closePeriod' ? ' хаагдлаа.' : ' нээгдлээ.'), 'ok'); pgPeriods(period.slice(0, 4)); } catch (e) { err(e); }
}
async function yearAction(m, year) {
  const close = m === 'closeYear';
  if (!await confirmBox(close ? 'Жилийн хаалт' : 'Жилийн хаалтыг цуцлах',
    close ? `${year} оны орлого, зардлын дансыг хааж цэвэр ашгийг хуримтлагдсан ашгийн дансанд (${esc(S.M.settings.retained_account)}) шилжүүлээд бүх сарыг хаана. Үргэлжлүүлэх үү?`
      : `Хаалтын гүйлгээг буцааж, ${year}-12 сарыг нээнэ. Үргэлжлүүлэх үү?`, close ? 'Хаах' : 'Цуцлах', !close)) return;
  try { await call(m, { year }); toast(close ? 'Жилийн хаалт хийгдлээ.' : 'Жилийн хаалт цуцлагдлаа.', 'ok'); pgPeriods(year); } catch (e) { err(e); }
}

        <tr><td>1</td><td>2026-11-01</td><td>Борлуулалт</td><td>Б-101</td><td>2130</td><td></td><td></td><td></td><td></td><td>10000</td></tr></table></div>

function impTemplate() { downloadText('import_zagvar.csv', IMP_HEAD.join(',') + '\r\n1,2026-11-01,Борлуулалт,Б-101,1210,P0001,,,110000,\r\n1,2026-11-01,Борлуулалт,Б-101,4100,,,,,100000\r\n1,2026-11-01,Борлуулалт,Б-101,2130,,,,,10000\r\n'); }
function impFile(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#itxt').value = String(r.result).replace(/^﻿/, ''); impParse(); }; r.readAsText(f, 'utf-8'); }
function parseDelimited(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const d = first.indexOf('\t') >= 0 ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
function normDate(s) {
  s = String(s || '').trim();
  let m = /^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/.exec(s); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/.exec(s); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return s;
}
function impParse() {
  const rows = parseDelimited($('#itxt').value);
  if (rows.length && !/\d/.test(rows[0][1] || '')) rows.shift(); // толгой мөр
  const recs = rows.map(r => { const o = {}; IMP_COLS.forEach((c, i) => o[c] = String(r[i] === undefined ? '' : r[i]).trim()); o.date = normDate(o.date); return o; });
  const groups = {};
  recs.forEach((r, i) => { const k = r.key || '#' + i; const g = groups[k] || (groups[k] = { d: 0, c: 0, n: 0 }); g.d += toMinor(r.debit) || 0; g.c += toMinor(r.credit) || 0; g.n++; });
  const keys = Object.keys(groups), unbalanced = keys.filter(k => groups[k].d !== groups[k].c);
  S.imp = recs;
  $('#iprev').innerHTML = recs.length ? `<div class="card"><div class="card-h"><h3>Урьдчилан харах: ${recs.length} мөр, ${keys.length} гүйлгээ</h3>
    ${unbalanced.length ? `<span class="badge b-bad">${unbalanced.length} гүйлгээ тэнцэхгүй: ${esc(unbalanced.slice(0, 5).join(', '))}</span>` : '<span class="badge b-ok">Бүгд тэнцсэн</span>'}</div>
    <div class="tw"><table class="t small"><thead><tr>${IMP_HEAD.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${recs.slice(0, 100).map(r => `<tr>${IMP_COLS.map(c => `<td class="${c === 'debit' || c === 'credit' ? 'n' : ''}">${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    ${recs.length > 100 ? '<div class="small muted" style="padding:8px">Эхний 100 мөрийг харуулав.</div>' : ''}</div>` : '';
}
async function impRun() {
  if (!S.imp || !S.imp.length) return toast('Импортлох өгөгдөл алга.', 'err');
  try {
    const r = await call('importEntries', { rows: S.imp, post: $('#imode').value === 'post' });
    if (r.errors.length) { $('#iprev').insertAdjacentHTML('afterbegin', `<div class="alert bad"><b>Импорт хийгдсэнгүй:</b><br>${r.errors.map(esc).join('<br>')}</div>`); return; }
    toast(r.imported + ' гүйлгээ импортлогдлоо.', 'ok'); $('#itxt').value = ''; S.imp = null;
    $('#iprev').innerHTML = `<div class="alert ok">${r.imported} гүйлгээ ${$('#imode').value === 'post' ? 'батлагдлаа' : 'ноорог болж орлоо'}. <a onclick="go('entries')">Журнал руу →</a></div>`;
  } catch (e) { err(e); }
}
